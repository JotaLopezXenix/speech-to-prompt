<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech-to-Prompt</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <span class="app-icon">🎙</span>
      <h1 class="app-title">Speech-to-Prompt</h1>
    </div>
    <div class="header-right">
      <button class="btn-icon" id="btn-history" title="Historial de sesiones" aria-label="Historial">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-settings" title="Ajustes" aria-label="Ajustes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="phase-indicator" id="phase-indicator" aria-hidden="true">
    <div class="phase-step" data-phase="1">
      <span class="phase-dot"></span>
      <span class="phase-label">Captura</span>
    </div>
    <div class="phase-connector"></div>
    <div class="phase-step" data-phase="3">
      <span class="phase-dot"></span>
      <span class="phase-label">Revisión</span>
    </div>
    <div class="phase-connector"></div>
    <div class="phase-step" data-phase="4">
      <span class="phase-dot"></span>
      <span class="phase-label">Destilación</span>
    </div>
    <div class="phase-connector"></div>
    <div class="phase-step" data-phase="5">
      <span class="phase-dot"></span>
      <span class="phase-label">Resultado</span>
    </div>
  </div>

  <main class="main-content">
    <div id="phase-container"></div>
  </main>

  <!-- Settings panel -->
  <div class="overlay" id="overlay" hidden></div>
  <aside class="settings-panel" id="settings-panel" hidden aria-label="Ajustes">
    <div id="settings-container"></div>
  </aside>

  <!-- History panel -->
  <aside class="history-panel" id="history-panel" hidden aria-label="Historial">
    <div id="history-container"></div>
  </aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
