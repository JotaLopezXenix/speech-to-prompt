<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; }
  a { color: #2F5D50; text-decoration: none; }
  a:hover { color: #274E43; }
</style>
</helmet>
<div style="min-height:100vh;background:#EDE8DD;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#201E19;display:flex;justify-content:center;padding:34px 16px 56px;">
  <div style="width:390px;height:844px;border-radius:44px;background:#111;padding:11px;box-shadow:0 28px 60px -22px rgba(32,30,25,.5),0 6px 18px -8px rgba(32,30,25,.35);flex:none;">
    <div style="width:100%;height:100%;border-radius:34px;overflow:hidden;background:#F3EFE7;display:flex;flex-direction:column;position:relative;">

      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 24px 2px;font-size:13px;font-weight:600;color:#201E19;flex:none;">
        <span style="font-variant-numeric:tabular-nums;">9:41</span>
        <span style="width:16px;height:9px;border:1.5px solid #201E19;border-radius:3px;display:inline-block;position:relative;"><span style="position:absolute;inset:1.5px;background:#201E19;border-radius:1px;"></span></span>
      </div>

      <header style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 12px;flex:none;">
        <button aria-label="Volver" style="width:38px;height:38px;border-radius:10px;border:1px solid #E7E0D2;background:#FBF8F2;display:flex;align-items:center;justify-content:center;cursor:pointer;"><span style="width:9px;height:9px;border-left:2px solid #6B6456;border-bottom:2px solid #6B6456;transform:rotate(45deg);margin-left:3px;"></span></button>
        <span style="font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:600;">Ajustes</span>
        <div style="width:38px;flex:none;"></div>
      </header>

      <main style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:6px 20px 28px;">

        <div style="display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1px solid #E7E0D2;border-radius:16px;padding:16px;">
          <div style="width:48px;height:48px;border-radius:999px;background:#E4ECE7;color:#2F5D50;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex:none;">JC</div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
            <span style="font-size:16px;font-weight:600;">Juan Carlos</span>
            <span style="font-size:13px;color:#8A8272;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">jc@xenix.es · Microsoft</span>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A8272;font-weight:600;">Proveedores</div>
          <div style="background:#FFFFFF;border:1px solid #E7E0D2;border-radius:14px;overflow:hidden;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Transcripción</span>
              <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#6B6456;">Whisper <span style="font-size:10px;color:#A79E8D;">▾</span></span>
            </div>
            <div style="height:1px;background:#F0EBDF;"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Destilado</span>
              <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#6B6456;">Claude <span style="font-size:10px;color:#A79E8D;">▾</span></span>
            </div>
            <div style="height:1px;background:#F0EBDF;"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Clave API</span>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#8A8272;letter-spacing:.1em;">••••••••3f2a</span>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A8272;font-weight:600;">Preferencias</div>
          <div style="background:#FFFFFF;border:1px solid #E7E0D2;border-radius:14px;overflow:hidden;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Idioma</span>
              <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#6B6456;">Español <span style="font-size:10px;color:#A79E8D;">▾</span></span>
            </div>
            <div style="height:1px;background:#F0EBDF;"></div>
            <div style="display:flex;flex-direction:column;gap:11px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Tema</span>
              <div style="display:flex;gap:6px;background:#F3EFE7;border:1px solid #E7E0D2;border-radius:999px;padding:4px;">
                <button onClick="{{ setClaro }}" style="{{ segClaro }}">Claro</button>
                <button onClick="{{ setOscuro }}" style="{{ segOscuro }}">Oscuro</button>
                <button onClick="{{ setSistema }}" style="{{ segSistema }}">Sistema</button>
              </div>
            </div>
            <div style="height:1px;background:#F0EBDF;"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;">
              <span style="font-size:14.5px;font-weight:500;">Guardar sesiones automáticamente</span>
              <button onClick="{{ toggleAuto }}" aria-label="Guardar automáticamente" style="{{ trackAuto }}"><span style="{{ knobAuto }}"></span></button>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8A8272;font-weight:600;">Cuenta</div>
          <div style="background:#FFFFFF;border:1px solid #E7E0D2;border-radius:14px;overflow:hidden;">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 16px;cursor:pointer;">
              <span style="font-size:14.5px;font-weight:500;color:#B4472E;">Cerrar sesión</span>
              <span style="width:8px;height:8px;border-right:2px solid #E0B4A8;border-top:2px solid #E0B4A8;transform:rotate(45deg);"></span>
            </div>
          </div>
          <span style="font-size:12px;color:#A79E8D;text-align:center;margin-top:2px;">Speech-to-Prompt · versión 2.0</span>
        </div>

      </main>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'claro', auto: true };
  seg(a) { return { flex:'1', border:'none', cursor:'pointer', borderRadius:'999px', padding:'8px 0', fontSize:'13px', fontWeight:'600', fontFamily:'inherit', background:a?'#2F5D50':'transparent', color:a?'#FBF8F2':'#6B6456' }; }
  track(on) { return { position:'relative', width:'46px', height:'27px', borderRadius:'999px', border:'none', cursor:'pointer', flex:'none', padding:'0', background:on?'#2F5D50':'#DDD5C4', transition:'background .15s' }; }
  knob(on) { return { position:'absolute', top:'3px', left:on?'22px':'3px', width:'21px', height:'21px', borderRadius:'999px', background:'#fff', boxShadow:'0 1px 3px rgba(0,0,0,.2)', transition:'left .15s', display:'block' }; }
  renderVals() {
    const t = this.state.theme;
    return {
      setClaro:()=>this.setState({theme:'claro'}), setOscuro:()=>this.setState({theme:'oscuro'}), setSistema:()=>this.setState({theme:'sistema'}),
      segClaro:this.seg(t==='claro'), segOscuro:this.seg(t==='oscuro'), segSistema:this.seg(t==='sistema'),
      toggleAuto:()=>this.setState(p=>({auto:!p.auto})), trackAuto:this.track(this.state.auto), knobAuto:this.knob(this.state.auto),
    };
  }
}
</script>
</body>
</html>
